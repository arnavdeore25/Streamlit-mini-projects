
[theme]
base = "dark"

# Colors
primaryColor = "#B69CFF"
backgroundColor = "#17151F"
secondaryBackgroundColor = "#242132"
textColor = "#F4F0FF"
borderColor = "#393348"

# Fonts
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
codeFont = "monospace"

# Typography
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["2.5rem", "2rem", "1.5rem", "1.25rem", "1.1rem", "1rem"]
headingFontWeights = [800, 700, 700, 600, 600, 600]

# Data tables
dataframeHeaderBackgroundColor = "#302A40"
dataframeBorderColor = "#393348"
dataframeRowHeight = 38

[theme.sidebar]
backgroundColor = "#1E1B2B"
secondaryBackgroundColor = "#292438"
primaryColor = "#B69CFF"
textColor = "#F4F0FF"
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
